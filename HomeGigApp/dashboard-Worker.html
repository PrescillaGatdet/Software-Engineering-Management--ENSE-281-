<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeGigs | Worker Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Fugaz+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="worker-mode">

    <nav id="sidebar">
        <div class="nav-links">
            <div class="top-nav">
                <a href="dashboard-worker.html" class="active">
                    <img src="IMAGES/HomeSymbol.png" class="nav-icon" alt="Home">
                </a>
                <a href="#"><img src="IMAGES/InboxSymbol.png" class="nav-icon" alt="Chats"></a>
                <a href="#"><img src="IMAGES/EarningSymbol.png" class="nav-icon" alt="Earnings"></a>
            </div>
            
            <div class="bottom-nav">
                <a href="#"><img src="IMAGES/ProfileSymbol.png" class="nav-icon" alt="Profile"></a>
            </div>
        </div>
    </nav>

    <main class="dashboard-content">
        <header class="dashboard-header">
            <div class="title-container">
                <img id="DashboardLogo" src="IMAGES/HomeGigsLogo.png" alt="HomeGigs Logo">

            </div>
            <p class="welcome-text">Welcome [First Name]! Find a gig available now or one scheduled for near future and earn money...</p>
        </header>

        <section class="content-body">
            <div class="placeholder-card">
                <p>There are no gigs available yet. Please try again later.</p>
            </div>
            <div style="height: 1200px;"></div>
        </section>

    <script src="JAVASCRIPT/script.js"></script>
