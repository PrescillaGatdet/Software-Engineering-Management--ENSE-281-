

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeGigs — My Account</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <div class="topbar">
    <div class="topbar__menu" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </div>
    <span class="topbar__title">My Account</span>
    <a class="topbar__chat" href="conversations.html?role=customer">
      <svg viewBox="0 0 24 24" fill="var(--purple-dark)"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
    </a>
  </div>

  <div class="page page--no-bottom" style="padding-bottom:100px;">

    <!-- Profile Card -->
    <div style="background:var(--purple);border-radius:var(--radius-md);padding:20px;margin-bottom:20px;display:flex;gap:16px;align-items:center;">
      <div style="width:60px;height:60px;background:var(--gold-light);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0;">🏡</div>
      <div>
        <div style="font-weight:900;color:var(--white);font-size:1.1rem;">Sam Customer</div>
        <div style="color:rgba(255,255,255,.7);font-size:.8rem;">sam@homegigs.ca</div>
        <div style="display:flex;gap:6px;margin-top:6px;">
          <span style="background:var(--gold);color:#fff;font-size:.7rem;font-weight:800;padding:3px 10px;border-radius:99px;">⭐ 4.9</span>
          <span style="background:rgba(255,255,255,.2);color:#fff;font-size:.7rem;font-weight:800;padding:3px 10px;border-radius:99px;">Customer</span>
        </div>
      </div> 
    </div>

    <a class="account-item" href="my-info.html?role=customer">👤 My Information</a>
    <a class="account-item" href="profile-ratings.html?id=1">⭐ Provide Ratings</a>
    <a class="account-item" href="support.html?role=customer">📊 Spending Statements</a>
    <a class="account-item" href="paying-methods.html">💳 Paying Methods</a>
    <a class="account-item" href="support.html?role=customer">💬 Chat Support</a>
    <a class="account-item" href="support.html?role=customer">🚨 Report Problem</a>
    <div class="account-item" style="color:var(--red);" onclick="logOut()">🚪 Log Out</div>

    <div style="text-align:center;padding:30px 0 10px;">
      <div style="font-family:var(--font-display);font-size:2rem;color:var(--purple-dark);letter-spacing:3px;">HomeGigs</div>
      <div style="font-size:.75rem;color:#ccc;margin-top:4px;">v1.0.0 — Customer</div>
    </div>
  </div>

  <!-- Bottom Bar -->
  <nav class="bottombar">
    <a class="bottombar__btn" href="dashboard-customer.html">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </a>
    <a class="bottombar__btn bottombar__btn--post" href="post-gig.html">
      <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
      <span>Post</span>
    </a>
    <a class="bottombar__btn active" href="account-customer.html">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Account</span>
    </a>
  </nav>

  <!-- Overlay Menu -->
  <div class="overlay-menu" id="overlayMenu" onclick="handleOverlayClick(event)">
    <div class="overlay-menu__panel">
      <div class="overlay-menu__header">MENU</div>
      <a class="overlay-menu__item" href="dashboard-customer.html">🏠 Dashboard</a>
      <a class="overlay-menu__item" href="post-gig.html">➕ Post a Gig</a>
      <a class="overlay-menu__item" href="conversations.html?role=customer">💬 Messages</a>
      <a class="overlay-menu__item" href="account-customer.html">👤 My Account</a>
      <a class="overlay-menu__item" href="index.html">🚪 Log Out</a>
      <div class="overlay-menu__close">
        <button class="btn btn--back" onclick="toggleMenu()">← Back</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="js/app.js"></script>
  <script>
    function logOut() {
      if (confirm('Log out of HomeGigs?')) window.location.href = 'index.html';
    }
  </script>
</body>
</html>
