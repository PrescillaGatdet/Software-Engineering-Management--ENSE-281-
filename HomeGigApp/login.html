<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeGigs | Log In</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Fugaz+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <div class="main-wrapper">
        <div class="form-card">
            <div class="input-group">
                <label for="username">Email Address or Phone Number:</label>
                <input type="text" id="username" placeholder="Enter email or phone...">
            </div>
            <div class="input-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter password...">
            </div>
        </div>

        <div class="interaction-area">
            <div id="login-button-section">
                <button type="submit" class="homegigs-button login-btn">Log in as Customer</button>
                <button type="submit" class="homegigs-button login-btn">Log in as Worker</button>
                
                <div class="back-button-container">
                    <a href="index.html" class="back-arrow-link">
                        <svg width="60" height="24" viewBox="0 0 60 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1 12H59M1 12L12 1M1 12L12 23" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
