<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeGigs | Post Gig</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Fugaz+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="customer-mode">

    <nav id="sidebar">
        <div class="nav-links">
            <div class="top-nav">
                <a href="dashboard-customer.html">
                    <img src="IMAGES/HomeSymbol.png" class="nav-icon" alt="Home">
                </a>
                <a href="#"><img src="IMAGES/InboxSymbol.png" class="nav-icon" alt="Chats"></a>
                <a href="post-gig.html" class="active">
                    <img src="IMAGES/AddPostSymbol.png" class="nav-icon" alt="Post">
                </a>
            </div>
            
            <div class="bottom-nav">
                <a href="account-customer.html"><img src="IMAGES/ProfileSymbol.png" class="nav-icon" alt="Profile"></a>
            </div>
        </div>
    </nav>

    <main class="dashboard-content">
        <header class="dashboard-header">
            <div class="title-container">
                <img id="DashboardLogo" src="IMAGES/HomeGigsLogo.png" alt="HomeGigs Logo">
                <h1 class="purple-heading">Post Gig</h1>
            </div>
            <p class="welcome-text">Submit the form to post a gig and find workers to get the job done...</p>
        </header>

        <section class="content-body">
            
            <h2 class="carousel-heading">Gig submission form</h2>

            <div class="form-container">
                <form action="/post-gig" method="POST" enctype="multipart/form-data">
                    
                    <div class="form-group">
                        <label>Gig Category:</label>
                        <select name="category" required>
                            <option value="">Select a category</option>
                            <option value="Assembling">Assembling</option>
                            <option value="Leaves Raking">Leaves Raking</option>
                            <option value="Moving">Moving</option>
                            <option value="Painting">Painting</option>
                            <option value="Plumbing">Plumbing</option>
                            <option value="Snow Blowing">Snow Blowing</option>
                            <option value="Windows Cleaning">Windows Cleaning</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Gig Title:</label>
                        <input type="text" name="title" placeholder="e.g., Fix leaky faucet" required>
                    </div>

                    <div class="form-group">
                        <label>Gig Description:</label>
                        <textarea name="description" rows="4" placeholder="Describe the job in detail..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label>Home Address:</label>
                        <input type="text" name="address" placeholder="e.g., 123 Street Name, Unit 45, Regina, SK" required>
                    </div>

                    <div class="form-group">
                        <label>Date Needed:</label>
                        <p class="form-instruction">Enter a date for Scheduled Gig or leave it without a date for On The Spot Gig</p>
                        <input type="date" name="date_needed">
                    </div>

                    <div class="form-group">
                        <label>Budget Allocation ($):</label>
                        <input type="number" name="budget" placeholder="Enter amount" required>
                    </div>

                    <div class="form-group">
                        <label>Upload Images:</label>
                        <input type="file" name="gig_images" multiple>
                    </div>

                    <button type="submit" class="submit-gig-btn">POST NOW</button>
                </form>
            </div>
            
            <div style="height: 100px;"></div>
        </section>
    </main>

    <script src="JAVASCRIPT/script.js"></script>
</body>
</html>
